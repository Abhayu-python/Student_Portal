<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EduPortal – Student Management Portal</title>
<style>
:root{--bg:#050b1f;--card:rgba(6,16,46,.62);--tx:#f4f8ff;--mut:#b7c6ea;--pri:#22d3ee;--lt:rgba(34,211,238,.14);--bd:rgba(125,211,252,.28);--ok:#34d399;--warn:#fbbf24;--bad:#ff8a8a;--sh:0 10px 36px rgba(0,8,30,.55);--hi:rgba(255,255,255,.14);--blur:18px;--pop:rgba(7,16,42,.97);--in:rgba(255,255,255,.07);--optbg:#0b1634;--grad:linear-gradient(135deg,#2563eb,#0e7490);--hero:linear-gradient(120deg,rgba(37,99,235,.6),rgba(8,145,178,.42));--ov1:rgba(2,8,28,.28);--ov2:rgba(2,8,28,.6);--glow:0 0 22px rgba(34,211,238,.32);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#e6efff;--card:rgba(255,255,255,.76);--tx:#071230;--mut:#33436b;--pri:#0e7490;--lt:rgba(14,116,144,.12);--bd:rgba(15,45,110,.2);--bad:#b91c1c;--sh:0 10px 34px rgba(5,25,80,.3);--hi:rgba(255,255,255,.9);--pop:rgba(247,250,255,.98);--in:rgba(255,255,255,.75);--optbg:#fff;--hero:linear-gradient(120deg,rgba(29,78,216,.9),rgba(14,116,144,.88));--ov1:rgba(215,230,255,.22);--ov2:rgba(215,230,255,.5);--glow:0 0 18px rgba(14,116,144,.22);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;font-weight:600;transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(29,78,216,.3)}
.btn.o{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.s{padding:6px 12px;font-size:13px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:22px;border:1px solid var(--bd);animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
[data-go],[data-sem],[data-sc],[data-pay]{cursor:pointer}[data-go]:hover,[data-sem]:hover,[data-sc]:hover,[data-pay]:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(29,78,216,.18);border-color:var(--pri)}
input,select,textarea{width:100%;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:11px 14px;outline:0;transition:.2s}input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--lt)}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}.err{color:var(--bad);font-size:12px;min-height:16px;margin-top:3px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#1d4ed8,#60a5fa)}
.lbox{width:100%;max-width:410px;background:var(--card);border-radius:24px;padding:34px;box-shadow:0 24px 60px rgba(0,0,40,.3)}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#1d4ed8,#60a5fa);display:grid;place-items:center;font-size:26px;margin-bottom:12px}
.pw{position:relative}.pw button{position:absolute;right:8px;top:7px;background:0;border:0;cursor:pointer;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0}.row label{margin:0;display:flex;gap:6px;align-items:center;font-weight:500}.row input{width:auto}
a{color:var(--pri);cursor:pointer;font-weight:600;text-decoration:none}
#app{display:none;min-height:100vh}#side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--card);border-right:1px solid var(--bd);padding:calc(20px + env(safe-area-inset-top,0px)) 14px 20px;z-index:30;transition:.3s;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px;color:var(--pri);padding:0 8px 18px}.brand .logo{margin:0;width:38px;height:38px;font-size:19px;border-radius:12px}
.nav{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;color:var(--mut);cursor:pointer;font-weight:600;margin-bottom:3px;transition:.2s}.nav:hover{background:var(--lt);color:var(--pri)}.nav.on{background:var(--pri);color:#fff;box-shadow:0 6px 14px rgba(29,78,216,.3)}
#main{margin-left:250px;padding:0 26px 40px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:14px;align-items:center;padding:16px 0;background:var(--bg)}
#burger{display:none;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:18px}
.sw{position:relative;flex:1;max-width:420px}#res{position:absolute;top:48px;left:0;right:0;z-index:40;display:none;padding:8px}.ri{padding:9px 12px;border-radius:10px;cursor:pointer}.ri:hover{background:var(--lt)}
.dd{position:absolute;right:0;top:50px;min-width:240px;z-index:40;display:none;padding:10px}.dd.show,#res.show{display:block}
.ib{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:12px;width:42px;height:42px;cursor:pointer;font-size:18px}.dot{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px}
.av{width:42px;height:42px;border-radius:50%;border:3px solid var(--pri);object-fit:cover;cursor:pointer}
.g{display:grid;gap:18px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
h1{font-size:26px;margin:6px 0 4px}h2{font-size:18px;margin:0 0 14px}.mut{color:var(--mut)}
.stat{display:flex;gap:14px;align-items:center}.ico{width:50px;height:50px;border-radius:14px;background:var(--lt);display:grid;place-items:center;font-size:22px}.stat b{font-size:22px;display:block}
.hero{background:linear-gradient(120deg,#1d4ed8,#5b9bff);color:#fff;border:0;margin-bottom:18px}
.bar{height:10px;border-radius:99px;background:var(--lt);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1d4ed8,#60a5fa);transition:width 1s}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-size:12px;text-transform:uppercase}.tw{overflow-x:auto}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--lt);color:var(--pri)}.badge.w{background:#fef3c7;color:#b45309}.badge.g{background:#dcfce7;color:#15803d}
.pf{display:flex;gap:26px;flex-wrap:wrap;align-items:center}.pf img{width:140px;height:140px;border-radius:50%;border:5px solid var(--pri);padding:3px;background:var(--card)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;flex:1}.kv small{color:var(--mut);display:block;font-size:12px}
.notice{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--bd)}.notice:last-child{border:0}
.ov{position:fixed;inset:0;background:rgba(10,20,50,.5);display:none;place-items:center;z-index:60;padding:16px;backdrop-filter:blur(3px)}.ov.show{display:grid}.md{width:100%;max-width:460px;max-height:90vh;overflow:auto}
#ld{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;opacity:0;pointer-events:none;transition:.25s}#ld.show{opacity:.92;pointer-events:all}
.sp{width:46px;height:46px;border:5px solid var(--lt);border-top-color:var(--pri);border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(90px);background:#0f1b3d;color:#fff;padding:12px 22px;border-radius:12px;z-index:120;transition:.3s}#toast.show{transform:translateX(-50%)}
@media(max-width:900px){#side{transform:translateX(-100%)}#side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}#main{margin-left:0;padding:0 16px 30px}#burger{display:block}}

hist:[{d:"12 Jul 2026",t:"TXN20260712A91",a:20000,m:"UPI"},{d:"05 Sep 2026",t:"TXN20260905K44",a:10000,m:"Net Banking"}],

async function init(){applyTheme();if(sb)return sbInit();

 if(!id||pw.length<6)return;if(sb)return sbLogin(id,pw);const key=Object.keys(P.ph).find(k=>k.toLowerCase()===id.toLowerCase());

 ...P.notices.filter(n=>n.t.toLowerCase().includes(v)).map(n=>["📢 "+n.t,"notice"])].slice(0,7);
 r.innerHTML=hits.length?hits.map(h=>`<div class="ri" data-k="${h[1]}">${esc(h[0])}</div>`).join(""):`<div class="ri mut">No results</div>`;r.classList.add("show");
 r.onclick=e=>{const k=e.target.closest(".ri")?.dataset.k;if(k){r.classList.remove("show");$("#q").value="";go(k)}}};

<div class="card" style="margin-top:18px"><h2>Payment Progress</h2>${feeBar()}<button class="btn" style="margin-top:16px" onclick="pay()" ${P.paid>=45000?"disabled":""}>💳 Pay Now</button></div>
<div class="card tw" id="hist" style="margin-top:18px"><h2>Payment History</h2><table><tr><th>Date</th><th>Transaction ID</th><th>Mode</th><th>Amount</th><th>Receipt</th></tr>${P.hist.map((h,i)=>`<tr><td>${h.d}</td><td>${h.t}</td><td>${h.m}</td><td>${inr(h.a)}</td><td><button class="btn o s" onclick="receipt(${i})">Download Fee Receipt</button></td></tr>`).join("")}</table></div>`},
exam(){return`<h1>Examination</h1><div class="card tw" style="margin-top:14px">${examTbl()}</div>`},
notice(){return`<h1>Notice Board</h1>${user.role==="admin"?`<div class="card" style="margin:14px 0"><h2>Post a notice</h2><div class="g g2"><div><label>Title</label><input id="nt"></div><div><label>Category</label><select id="ncat"><option>Exam</option><option>Holiday</option><option>Fees</option><option>Event</option><option>Academic</option></select></div></div><label>Details</label><textarea id="nx" rows="3"></textarea><div class="err" id="ne"></div><button class="btn" onclick="postN()">Publish notice</button></div>`:""}
<div class="card" style="margin-top:14px"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">${["All","Exam","Holiday","Fees","Event","Academic"].map(c=>`<button class="btn s ${c==="All"?"":"o"}" onclick="filt('${c}',this)">${c}</button>`).join("")}</div><div id="nl">${P.notices.map(nt).join("")}</div></div>`},
settings(){return`<h1>Settings</h1><div class="g g2" style="margin-top:14px"><div class="card"><h2>Appearance</h2><label>Theme</label><select id="th"><option value="">Dark glass (default)</option><option value="light">Light glass</option></select></div>
<div class="card"><h2>Change Password</h2><label>Current password</label><input type="password" id="cp"><label>New password</label><input type="password" id="np"><div class="err" id="pe"></div><button class="btn" onclick="chgPw()">Update password</button></div></div>`}};
function nt(n){return`<div class="notice" data-c="${n.c}"><div class="ico">${{Exam:"📝",Holiday:"🏖️",Fees:"💰",Event:"🎉",Academic:"📚"}[n.c]||"📢"}</div><div><b>${esc(n.t)}</b> <span class="badge">${n.c}</span><div class="mut">${esc(n.x)}</div><small class="mut">${n.d}</small></div></div>`}
function feeBar(){const p=Math.round(P.paid/450);return`<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>${inr(P.paid)} of ${inr(45000)} paid</span><b>${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div>`}
function subTbl(){return`<table><tr><th>Subject</th><th>Subject Code</th></tr>${SUBJ.map(s=>`<tr><td>${s[0]}</td><td><span class="badge">${s[1]}</span></td></tr>`).join("")}</table>`}
function examTbl(){return`<h2>7th Semester – Exam Schedule</h2><div class="tw"><table><tr><th>Subject</th><th>Code</th><th>Date</th><th>Time</th><th>Venue</th><th>Status</th></tr>${EXAMS.map(e=>{const u=true;return`<tr><td>${e[0]}</td><td>${e[1]}</td><td>${new Date(e[2]).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}</td><td>${e[3]}</td><td>${e[4]}</td><td><span class="badge ${u?"w":"g"}">Upcoming</span></td></tr>`}).join("")}</table></div><h2 style="margin-top:24px">Semester Examination Status</h2><div class="tw"><table><tr><th>Semester</th><th>Status</th></tr>${SEMS.map((s,i)=>`<tr><td>Semester ${i+1}</td><td><span class="badge ${i<6?"g":"w"}">${i<6?"Completed":"Upcoming"}</span></td></tr>`).join("")}</table></div>`}
function admin(){const R=[["ADM2026001","Rahul Sharma","B.Tech CS &amp; IT","92%","Partial"],["ADM2026002","Priya Verma","BCA","96%","Paid"],["ADM2026003","Aman Gupta","BBA","81%","Partial"],["ADM2026004","Sneha Singh","B.Com","89%","Paid"]];
 return`<div class="card hero"><h1>Welcome, Admin!</h1><div>Manage students and publish notices.</div></div><div class="g g4">${[["🎓","Students",R.length],["📢","Notices",P.notices.length],["💳","Fee Collected",inr(P.paid)]].map(s=>`<div class="card stat"><div class="ico">${s[0]}</div><div><span class="mut">${s[1]}</span><b>${s[2]}</b></div></div>`).join("")}</div>
<div class="card tw" style="margin-top:18px"><h2>Students</h2><table><tr><th>Admission No.</th><th>Name</th><th>Course</th><th>Attendance</th><th>Fees</th></tr>${R.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`}
function render(){$("#view").innerHTML=V[view]();document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.k===view));
 const t=$("#th");if(t){t.value=P.theme==="light"?"light":"";t.onchange=()=>{P.theme=t.value;save();applyTheme()}};tick();scrollTo(0,0)}
function tick(){const c=$("#clk");if(c)c.textContent=new Date().toLocaleString("en-IN",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",second:"2-digit"})}setInterval(tick,1000);
// ---------- actions
function filt(c,b){b.parentNode.querySelectorAll("button").forEach(x=>x.classList.add("o"));b.classList.remove("o");$("#nl").innerHTML=P.notices.filter(n=>c==="All"||n.c===c).map(nt).join("")||`<p class="mut">No notices.</p>`}
async function postN(){const t=$("#nt").value.trim(),x=$("#nx").value.trim();if(t.length<5||x.length<10){$("#ne").textContent="Add a title (5+ chars) and details (10+ chars)";return}
 if(sb){const{error}=await sb.from("notices").insert({category:$("#ncat").value,title:t,details:x});if(error){$("#ne").textContent="Could not publish: "+error.message;return}try{await loadNotices()}catch(e){}bell();toast("Notice published");render();return}P.notices.unshift({c:$("#ncat").value,t,x,d:new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})});save();bell();toast("Notice published");render()}
function editP(){const p=P.profile;modal(`<h2>Edit Profile</h2>${[["name","Full name"],["email","Email"],["phone","Phone"],["address","Address"]].map(f=>`<label>${f[1]}</label><input id="f_${f[0]}" value="${esc(p[f[0]])}"><div class="err" id="r_${f[0]}"></div>`).join("")}<div style="display:flex;gap:10px;margin-top:14px"><button class="btn" id="sv">Save changes</button><button class="btn o" onclick="closeM()">Cancel</button></div>`,()=>{$("#sv").onclick=()=>{const v=k=>$("#f_"+k).value.trim(),er={name:v("name").length<3?"Enter a valid name":"",email:/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("email"))?"":"Enter a valid email",phone:/^\+?[0-9 ]{10,15}$/.test(v("phone"))?"":"Enter a valid phone number",address:v("address").length<5?"Enter your address":""};
 for(const k in er)$("#r_"+k).textContent=er[k];if(Object.values(er).some(Boolean))return;const nv={};for(const k in er)nv[k]=v(k);const done=()=>{Object.assign(P.profile,nv);save();closeM();shell();render();toast("Profile updated")};if(sb){sb.from("profiles").update(nv).eq("id",UID).then(({error})=>error?toast("Could not save: "+error.message):done())}else done()}})}
function pay(){const rem=45000-P.paid;modal(`<h2>Pay Fees</h2><div class="mut">Remaining balance: <b>${inr(rem)}</b></div><label>Amount (₹)</label><input id="pa2" type="number" value="${rem}"><div class="err" id="pe2"></div><label>Payment mode</label><select id="pm"><option>UPI</option><option>Debit / Credit Card</option><option>Net Banking</option></select><div style="display:flex;gap:10px;margin-top:16px"><button class="btn" id="pp">Pay securely</button><button class="btn o" onclick="closeM()">Cancel</button></div><p class="mut" style="font-size:12px">Demo payment – no real money is charged.</p>`,()=>{$("#pp").onclick=()=>{const a=Number($("#pa2").value);if(!(a>=1&&a<=rem)){$("#pe2").textContent="Enter an amount between ₹1 and "+inr(rem);return}
 closeM();const pmv=$("#pm").value;if(sb)return sbPay(a,pmv);load(1200,()=>{P.paid+=a;P.hist.push({d:new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}),t:"TXN"+Date.now().toString(36).toUpperCase(),a,m:$("#pm").value});save();render();toast("Payment of "+inr(a)+" successful")})}})}
function receipt(i){const h=P.hist[i],p=P.profile;modal(`<div id="rc"><h2 style="text-align:center;color:var(--pri)">🎓 EduPortal – Fee Receipt</h2><table><tr><td>Student</td><td><b>${esc(p.name)}</b></td></tr><tr><td>Admission No.</td><td>${p.adm}</td></tr><tr><td>Course</td><td>${p.course}, ${p.sem}</td></tr><tr><td>Transaction ID</td><td>${h.t}</td></tr><tr><td>Date</td><td>${h.d}</td></tr><tr><td>Mode</td><td>${h.m}</td></tr><tr><td>Amount Paid</td><td><b>${inr(h.a)}</b></td></tr></table></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn" onclick="try{window.print()}catch(e){toast('Printing is unavailable here')}">🖨️ Print / Save as PDF</button><button class="btn o" onclick="closeM()">Close</button></div>`)}
async function chgPw(){const c=$("#cp").value,n=$("#np").value;if(sb)return sbChgPw(c,n);if(P.ph[user.id]!==await sha(c)){$("#pe").textContent="Current password is incorrect";return}
 if(n.length<8||!/\d/.test(n)){$("#pe").textContent="New password needs 8+ characters and a number";return}P.ph[user.id]=await sha(n);save();$("#cp").value=$("#np").value="";$("#pe").textContent="";toast("Password updated")}
document.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-sem],[data-sc],[data-pay]");if(!t)return;if(t.dataset.go)go(t.dataset.go);else if(t.dataset.sem)semModal(+t.dataset.sem);else if(t.dataset.sc)document.getElementById("hist")?.scrollIntoView({behavior:"smooth"});else if(t.dataset.pay&&P.paid<45000)pay()});
// ---------- Supabase data layer (used only when SUPABASE_URL and SUPABASE_ANON_KEY are set)
const toEmail=id=>id.includes("@")?id.toLowerCase():id.toLowerCase()+"@eduportal.app";
const fmtD=t=>new Date(t).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
async function loadNotices(){const{data,error}=await sb.from("notices").select("*").order("created_at",{ascending:false});if(error)throw error;P.notices=data.map(n=>({c:n.category,t:n.title,x:n.details,d:fmtD(n.created_at)}))}
async function loadPay(){const{data,error}=await sb.from("payments").select("*").order("created_at");if(error)throw error;P.paid=data.reduce((a,x)=>a+x.amount,0);P.hist=data.map(x=>({d:fmtD(x.created_at),t:x.txn,a:x.amount,m:x.mode}))}
async function hydrate(session){UID=session.user.id;const{data:p,error}=await sb.from("profiles").select("*").eq("id",UID).single();if(error||!p)throw error||new Error("no profile");
 P.profile={name:p.name,adm:p.adm,course:p.course||"",sem:p.sem||"",dob:p.dob||"",gender:p.gender||"",email:p.email||"",phone:p.phone||"",address:p.address||""};
 await Promise.all([loadNotices(),loadPay()]);return p.role}
async function sbInit(){const f=document.querySelector("#lf p.mut");if(f)f.style.display="none";
 const{data}=await sb.auth.getSession();if(!data.session)return;
 try{const r=await hydrate(data.session);enter(P.profile.adm,r)}catch(e){await sb.auth.signOut()}}
async function sbLogin(id,pw){const b=document.querySelector("#lf .btn");b.disabled=true;
 try{const{data,error}=await sb.auth.signInWithPassword({email:toEmail(id),password:pw});
  if(error){const m=error.message||"";$("#e3").textContent=/invalid login/i.test(m)?"Invalid credentials. Please try again.":/not confirmed/i.test(m)?"This account is not confirmed yet. Confirm the user in Supabase.":"Sign-in failed: "+m;return}
  let r;try{r=await hydrate(data.session)}catch(e){await sb.auth.signOut();$("#e3").textContent="Signed in, but no student profile exists for this account.";return}
  load(900,()=>enter(P.profile.adm,r))}
 catch(e){$("#e3").textContent="Network error. Check your connection and try again."}finally{b.disabled=false}}
async function sbPay(a,mode){$("#ld").classList.add("show");
 try{const txn="TXN"+Date.now().toString(36).toUpperCase();const{error}=await sb.from("payments").insert({user_id:UID,txn,amount:a,mode});if(error)throw error;await loadPay();render();toast("Payment of "+inr(a)+" successful")}
 catch(e){toast("Payment failed: "+(e.message||"try again"))}finally{$("#ld").classList.remove("show")}}
async function sbChgPw(c,n){const{error:e1}=await sb.auth.signInWithPassword({email:toEmail(user.id),password:c});
 if(e1){$("#pe").textContent="Current password is incorrect";return}
 if(n.length<8||!/\d/.test(n)){$("#pe").textContent="New password needs 8+ characters and a number";return}
 const{error}=await sb.auth.updateUser({password:n});if(error){$("#pe").textContent=error.message;return}
 $("#cp").value=$("#np").value="";$("#pe").textContent="";toast("Password updated")}
init();
</script></body></html>
